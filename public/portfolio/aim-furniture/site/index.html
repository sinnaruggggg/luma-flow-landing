<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>에임가구 포트폴리오 임베드</title>
    <style>
      :root {
        color: #1f1712;
        background: #f4eee6;
        font-family: Inter, "Pretendard Variable", "Noto Sans KR", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.86), transparent 32%),
          linear-gradient(180deg, #f7f0e8 0%, #e8ded2 100%);
      }

      .live-frame {
        display: none;
        width: 100%;
        height: 100vh;
        border: 0;
        background: #fbf8f4;
      }

      .embed-shell {
        min-height: 100vh;
        padding: clamp(14px, 2vw, 24px);
      }

      .embed-frame {
        overflow: hidden;
        border: 1px solid rgba(64, 48, 37, 0.12);
        border-radius: 28px;
        background: #fbf8f4;
        box-shadow: 0 24px 60px rgba(64, 48, 37, 0.12);
      }

      .embed-frame img {
        display: block;
        width: 100%;
        height: auto;
      }

      html.is-live,
      html.is-live body {
        height: 100%;
        overflow: hidden;
        background: #fbf8f4;
      }

      html.is-live .live-frame {
        display: block;
      }

      html.is-live .embed-shell {
        display: none;
      }

      @media (max-width: 720px) {
        .embed-shell {
          padding: 0;
        }

        .embed-frame {
          min-height: 100vh;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <iframe class="live-frame" title="에임가구 실제 웹페이지 임베드" referrerpolicy="no-referrer"></iframe>
    <main class="embed-shell" aria-label="에임가구 웹페이지 임베드">
      <div class="embed-frame">
        <picture>
          <source srcset="../home-mobile.png" media="(max-width: 720px)" />
          <img src="../home-desktop.png" alt="에임가구 웹페이지 미리보기" />
        </picture>
      </div>
    </main>
    <script>
      (() => {
        const liveSrc = "http://127.0.0.1:3001/";
        const frame = document.querySelector(".live-frame");

        if (!frame || window.location.protocol === "https:") {
          return;
        }

        fetch(liveSrc, { mode: "no-cors", cache: "no-store" })
          .then(() => {
            frame.src = liveSrc;
            document.documentElement.classList.add("is-live");
          })
          .catch(() => {
            document.documentElement.classList.remove("is-live");
          });
      })();
    </script>
  </body>
</html>
