<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta name="robots" content="noindex" />
    <script>
      (function redirectToApp(location) {
        var basePath = "/luma-flow-landing";
        var path = location.pathname || "/";
        var appPath = path.indexOf(basePath) === 0 ? path.slice(basePath.length) || "/" : path;
        var redirectTarget = basePath + "/?__redirect=" + encodeURIComponent(appPath + location.search + location.hash);
        location.replace(redirectTarget);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
