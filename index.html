  <body>
    <div id="root"></div>
    <script>
      (function restoreGithubPagesRoute(location) {
        var basePath = "%BASE_URL%".replace(/\/$/, "");
        var params = new URLSearchParams(location.search);
        var redirect = params.get("__redirect");

        if (!redirect) {
          return;
        }

        params.delete("__redirect");
        var nextSearch = params.toString();
        var nextUrl = basePath + redirect;
        if (nextSearch) {
          nextUrl += (redirect.indexOf("?") === -1 ? "?" : "&") + nextSearch;
        }
        window.history.replaceState(null, "", nextUrl);
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
